<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstaApp Library</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; background:#0b0b0d; color:#fff; }
    header { position:sticky; top:0; background:#0b0b0df0; backdrop-filter: blur(6px); border-bottom:1px solid #222; padding:12px 16px; display:flex; gap:10px; align-items:center; }
    .btn { background:#1c1c22; border:1px solid #2b2b33; color:#fff; padding:8px 10px; border-radius:10px; cursor:pointer; }
    .btn.active { border-color:#fff; }
    .wrap { display:grid; grid-template-columns: 1fr 360px; gap:12px; padding:12px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
    .card { border:1px solid #222; border-radius:14px; overflow:hidden; background:#121216; cursor:pointer; position:relative; }
    .tag { position:absolute; top:8px; left:8px; background:#000000aa; border:1px solid #ffffff33; padding:4px 8px; border-radius:999px; font-size:12px; }
    .count { position:absolute; top:8px; right:8px; background:#000000aa; border:1px solid #ffffff33; padding:4px 8px; border-radius:999px; font-size:12px; }
    .thumb { width:100%; aspect-ratio: 1 / 1; object-fit: cover; background:#000; display:block; }
    .meta { padding:10px; font-size:12px; color:#bdbdc7; }
    .meta .cap { color:#fff; font-size:13px; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    aside { border:1px solid #222; border-radius:16px; background:#121216; padding:12px; height: calc(100vh - 80px); position:sticky; top:70px; overflow:auto; }
    textarea { width:100%; min-height:140px; background:#0f0f13; color:#fff; border:1px solid #2b2b33; border-radius:12px; padding:10px; resize:vertical; }
    .row { display:flex; gap:8px; margin-top:10px; }
    .small { font-size:12px; color:#bdbdc7; }
    .preview { width:100%; border-radius:14px; border:1px solid #222; overflow:hidden; margin-top:10px; background:#000; }
    video, img { width:100%; display:block; }
    .pill { display:inline-block; padding:4px 8px; border:1px solid #2b2b33; border-radius:999px; font-size:12px; color:#bdbdc7; }
  </style>
</head>
<body>
  <header>
    <strong>InstaApp</strong>
    <button class="btn active" data-filter="">Hepsi</button>
    <button class="btn" data-filter="REEL">Reels</button>
    <button class="btn" data-filter="POST">Post</button>
    <button class="btn" data-filter="CAROUSEL">Carousel</button>
    <span style="margin-left:auto" class="small" id="count"></span>
  </header>

  <div class="wrap">
    <div>
      <div class="grid" id="grid"></div>
    </div>

    <aside>
      <div class="small">Seçili içerik</div>
      <div id="selInfo" style="margin-top:6px;">Henüz seçilmedi</div>

      <div class="preview" id="preview" style="display:none;"></div>

      <div style="margin-top:12px" class="small">Açıklama (caption)</div>
      <textarea id="caption" placeholder="Açıklama..."></textarea>

      <div class="row">
        <button class="btn" id="save">Kaydet</button>
        <button class="btn" id="reload">Yenile</button>
      </div>

      <div class="small" id="saveState" style="margin-top:10px;"></div>

      <hr style="border-color:#222; margin:14px 0;">
      <div class="small">
        Sonraki adım: Buraya “Paylaş” butonu ekleyip Instagram Graph API ile otomatik yayınlayacağız.
      </div>
    </aside>
  </div>

<script>
  let currentFilter = "";
  let selectedId = null;
  let cache = [];

  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  const captionEl = document.getElementById("caption");
  const selInfo = document.getElementById("selInfo");
  const preview = document.getElementById("preview");
  const saveState = document.getElementById("saveState");

  async function fetchLibrary() {
    const url = currentFilter ? `/api/library?type=${encodeURIComponent(currentFilter)}` : `/api/library`;
    const res = await fetch(url);
    cache = await res.json();
    renderGrid();
  }

  function renderGrid() {
    grid.innerHTML = "";
    count.textContent = `${cache.length} içerik`;

    for (const item of cache) {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => selectItem(item.id);

      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = item.type;

      const thumb = document.createElement(item.media[0].kind === "video" ? "video" : "img");
      thumb.className = "thumb";
      if (thumb.tagName === "VIDEO") {
        thumb.src = item.cover_url;
        thumb.muted = true;
        thumb.playsInline = true;
        thumb.preload = "metadata";
      } else {
        thumb.src = item.cover_url;
        thumb.loading = "lazy";
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const dt = item.created_at ? new Date(item.created_at).toLocaleString("tr-TR") : "";
      meta.innerHTML = `<div>${dt}</div><div class="cap">${escapeHtml(item.caption || "")}</div>`;

      card.appendChild(tag);
      if (item.media.length > 1) {
        const c = document.createElement("div");
        c.className = "count";
        c.textContent = `1/${item.media.length}`;
        card.appendChild(c);
      }
      card.appendChild(thumb);
      card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  async function selectItem(id) {
    selectedId = id;
    saveState.textContent = "";
    const res = await fetch(`/api/item/${encodeURIComponent(id)}`);
    const item = await res.json();

    selInfo.innerHTML = `
      <div style="font-size:14px; margin-top:6px;"><strong>${item.type}</strong> <span class="pill">${item.source_file}</span></div>
      <div class="small" style="margin-top:6px;">${item.created_at ? new Date(item.created_at).toLocaleString("tr-TR") : ""}</div>
      <div class="small" style="margin-top:6px;">Medya: ${item.media.length}</div>
    `;

    captionEl.value = item.caption || "";

    // preview
    preview.style.display = "block";
    preview.innerHTML = "";
    const first = item.media[0];
    if (first.kind === "video") {
      const v = document.createElement("video");
      v.src = first.url;
      v.controls = true;
      v.playsInline = true;
      preview.appendChild(v);
    } else {
      const img = document.createElement("img");
      img.src = first.url;
      preview.appendChild(img);
    }
  }

  document.getElementById("save").onclick = async () => {
    if (!selectedId) return;
    saveState.textContent = "Kaydediliyor...";
    const res = await fetch(`/api/item/${encodeURIComponent(selectedId)}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ caption: captionEl.value })
    });
    if (res.ok) {
      saveState.textContent = "✅ Kaydedildi";
      await fetchLibrary(); // grid caption güncellensin
    } else {
      saveState.textContent = "❌ Kaydedilemedi";
    }
  };

  document.getElementById("reload").onclick = fetchLibrary;

  document.querySelectorAll("button[data-filter]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("button[data-filter]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter") || "";
      selectedId = null;
      selInfo.textContent = "Henüz seçilmedi";
      preview.style.display = "none";
      captionEl.value = "";
      fetchLibrary();
    };
  });

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m]));
  }

  fetchLibrary();
</script>
</body>
</html>
