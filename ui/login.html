<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Amed Güncel Sosyal Medya Paneli</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        #register-form { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sosyal Medya Paneli</h1>
        <div class="tabs">
            <div class="tab active" id="login-tab">Giriş Yap</div>
            <div class="tab" id="register-tab">Kayıt Ol</div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Giriş Yap</button>
        </form>

        <form id="register-form">
            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const messageDiv = document.getElementById('message');

        loginTab.onclick = () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        };

        registerTab.onclick = () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        };

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            messageDiv.className = 'message';
            messageDiv.textContent = 'Giriş yapılıyor...';

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/library';
            } else {
                messageDiv.className = 'message error';
                messageDiv.textContent = data.error || 'Giriş başarısız';
            }
        };

        registerForm.onsubmit = async (e) => {
            e.preventDefault();
            messageDiv.className = 'message';
            messageDiv.textContent = 'Kayıt yapılıyor...';

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value
                })
            });

            const data = await res.json();
            if (res.ok) {
                messageDiv.className = 'message success';
                messageDiv.textContent = 'Kayıt başarılı! Şimdi giriş yapabilirsiniz.';
                loginTab.click();
            } else {
                messageDiv.className = 'message error';
                messageDiv.textContent = data.error || 'Kayıt başarısız';
            }
        };
    </script>
</body>
</html>
