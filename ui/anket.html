<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anket | InstaApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4268F6;
            --primary-hover: #2e50d6;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.3;
            color: var(--primary);
        }

        .question-block {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .question-block:last-child {
            border-bottom: none;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 0.85rem 1rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary);
            background-color: rgba(66, 104, 246, 0.05);
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .text-answer-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-answer-input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="container" id="surveyContainer">
        <div id="loading" class="loading-spinner">
            <i class="ri-loader-4-line ri-spin" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
            Anket yükleniyor...
        </div>
        <div id="surveyContent" style="display:none;">
            <h1 id="surveyTitle">Anket</h1>
            <div id="questionsContainer"></div>
            <button class="btn" id="voteBtn" onclick="submitVote()">
                <i class="ri-send-plane-fill"></i> Cevapları Gönder
            </button>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surveyId = urlParams.get('id');
        let currentSurveyData = null;

        if (!surveyId) {
            document.getElementById('loading').innerHTML = '<span style="color:red">Geçersiz anket bağlantısı.</span>';
        } else {
            loadSurvey();
        }

        async function loadSurvey() {
            try {
                const res = await fetch('/api/public/active-surveys');
                const surveys = await res.json();
                const survey = surveys.find(s => s.id == surveyId);

                if (!survey) {
                    document.getElementById('loading').innerHTML = 'Anket bulunamadı veya süresi dolmuş.';
                    return;
                }

                currentSurveyData = survey;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('surveyContent').style.display = 'block';
                document.getElementById('surveyTitle').innerText = survey.question;

                renderQuestions();

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'Bir hata oluştu.';
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = currentSurveyData.questions.map((q, idx) => {
                const isHidden = q.parent_question_id ? 'style="display:none;"' : '';
                return `
                    <div class="question-block" data-q-id="${q.id}" data-parent-q="${q.parent_question_id || ''}" data-parent-opt="${q.parent_option_id || ''}" ${isHidden}>
                        <label class="question-text">${escapeHTML(q.question_text)} ${q.selection_type === 'multiple' ? '<span style="font-size:0.7rem; color:var(--primary); font-weight:400;">(Birden fazla seçebilirsiniz)</span>' : ''}</label>
                        <div class="options-list">
                            ${q.options.map(opt => {
                                if (opt.option_type === 'text') {
                                    return `<input type="text" class="text-answer-input" placeholder="${escapeHTML(opt.option_text)}..." data-opt-id="${opt.id}">`;
                                } else {
                                    const inputType = q.selection_type === 'multiple' ? 'checkbox' : 'radio';
                                    return `
                                        <div class="option-item ${q.selection_type}" onclick="selectOption(${q.id}, ${opt.id}, this, '${q.selection_type}')" data-opt-id="${opt.id}">
                                            ${escapeHTML(opt.option_text)}
                                        </div>`;
                                }
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            
            checkVisibility(); // Başlangıçta gizlilikleri kontrol et
        }

        function selectOption(qId, optId, el, selectionType) {
            const qBlock = el.closest('.question-block');
            
            if (selectionType === 'multiple') {
                el.classList.toggle('selected');
            } else {
                qBlock.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
                el.classList.add('selected');
            }
            
            checkVisibility(); // Seçim değiştikçe alt soruları göster/gizle
        }

        function checkVisibility() {
            const qBlocks = document.querySelectorAll('.question-block');
            const selectedOptionIds = Array.from(document.querySelectorAll('.option-item.selected')).map(el => el.dataset.optId);

            let changed = false;
            qBlocks.forEach(block => {
                const pQId = block.dataset.parentQ;
                const pOptId = block.dataset.parentOpt;

                if (pQId && pOptId) {
                    const shouldBeVisible = selectedOptionIds.includes(pOptId);
                    const isVisible = block.style.display !== 'none';
                    
                    if (shouldBeVisible !== isVisible) {
                        block.style.display = shouldBeVisible ? 'block' : 'none';
                        changed = true;
                        
                        // Eğer gizlendiyse içindeki seçimleri temizle (zincirleme gizleme için)
                        if (!shouldBeVisible) {
                            block.querySelectorAll('.option-item').forEach(opt => opt.classList.remove('selected'));
                            block.querySelectorAll('.text-answer-input').forEach(input => input.value = '');
                        }
                    }
                }
            });

            // Eğer bir şey değiştiyse tekrar kontrol et (iç içe bağımlılıklar için)
            if (changed) checkVisibility();
        }

        async function submitVote() {
            const answers = [];
            const qBlocks = document.querySelectorAll('.question-block');

            qBlocks.forEach(block => {
                // Sadece görünür olan soruların cevaplarını alalım
                if (block.style.display === 'none') return;

                const qId = block.dataset.qId;
                const selectedOpts = block.querySelectorAll('.option-item.selected');
                const textInputs = block.querySelectorAll('.text-answer-input');

                selectedOpts.forEach(opt => {
                    answers.push({
                        question_id: qId === 'null' || qId === '' ? null : qId,
                        option_id: opt.dataset.optId
                    });
                });

                textInputs.forEach(textInput => {
                    if (textInput.value.trim() !== '') {
                        answers.push({
                            question_id: qId === 'null' || qId === '' ? null : qId,
                            option_id: textInput.dataset.optId,
                            text_answer: textInput.value.trim()
                        });
                    }
                });
            });

            if (answers.length === 0) {
                const status = document.getElementById('statusMessage');
                status.innerText = 'Lütfen en az bir soruyu cevaplayın.';
                status.style.display = 'block';
                status.style.backgroundColor = '#fee2e2';
                status.style.color = '#991b1b';
                return;
            }

            const btn = document.getElementById('voteBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Gönderiliyor...';

            try {
                const res = await fetch(`/api/public/surveys/${surveyId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById('surveyContent').innerHTML = `
                        <div style="text-align:center; padding:2rem 0;">
                            <i class="ri-checkbox-circle-line" style="font-size:5rem; color:var(--primary);"></i>
                            <h2 style="margin-top:1.5rem; font-size:1.8rem;">Teşekkürler!</h2>
                            <p style="color:var(--text-muted); margin-top:0.75rem; font-size:1.1rem;">Cevaplarınız başarıyla kaydedildi.</p>
                            <button class="btn" style="margin-top:2rem;" onclick="window.close()">Anketi Kapat</button>
                        </div>
                    `;
                } else {
                    status.innerText = data.error || 'Bir hata oluştu.';
                    status.style.display = 'block';
                    status.style.backgroundColor = '#fee2e2';
                    status.style.color = '#991b1b';
                    btn.innerHTML = '<i class="ri-send-plane-fill"></i> Tekrar Dene';
                    btn.disabled = false;
                }
            } catch (err) {
                status.innerText = 'Bağlantı hatası.';
                status.style.display = 'block';
                btn.disabled = false;
            }
        }

        function escapeHTML(str) {
            if (!str) return "";
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
