<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anket | InstaApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4268F6;
            --primary-hover: #2e50d6;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.3;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary);
            background-color: rgba(66, 104, 246, 0.05);
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 2rem;
            transition: background 0.2s;
        }

        .btn:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container" id="surveyContainer">
        <div id="loading">Yükleniyor...</div>
        <div id="surveyContent" style="display:none;">
            <h1 id="questionText">Soru Yükleniyor...</h1>
            <div class="options-list" id="optionsList"></div>
            <button class="btn" id="voteBtn" onclick="submitVote()" disabled>Oy Ver</button>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surveyId = urlParams.get('id');
        let selectedOptionId = null;

        if (!surveyId) {
            document.getElementById('loading').innerHTML = '<span style="color:red">Geçersiz anket bağlantısı.</span>';
        } else {
            loadSurvey();
        }

        async function loadSurvey() {
            try {
                const res = await fetch('/api/public/active-surveys');
                const surveys = await res.json();
                const survey = surveys.find(s => s.id == surveyId);

                if (!survey) {
                    document.getElementById('loading').innerHTML = 'Anket bulunamadı veya süresi dolmuş.';
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('surveyContent').style.display = 'block';
                document.getElementById('questionText').innerText = survey.question;

                const list = document.getElementById('optionsList');
                list.innerHTML = survey.options.map(opt => `
                    <div class="option-item" onclick="selectOption(${opt.id}, this)">
                        ${escapeHTML(opt.option_text)}
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = 'Bir hata oluştu.';
            }
        }

        function selectOption(id, el) {
            selectedOptionId = id;
            document.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('voteBtn').disabled = false;
        }

        async function submitVote() {
            if (!selectedOptionId) return;

            const btn = document.getElementById('voteBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerText = 'Gönderiliyor...';

            try {
                const res = await fetch(`/api/public/surveys/${surveyId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ option_id: selectedOptionId })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById('surveyContent').innerHTML = `
                        <div style="text-align:center; padding:2rem 0;">
                            <i class="ri-checkbox-circle-line" style="font-size:4rem; color:var(--primary);"></i>
                            <h2 style="margin-top:1rem;">Teşekkürler!</h2>
                            <p style="color:var(--text-muted); margin-top:0.5rem;">Oyunuz başarıyla kaydedildi.</p>
                        </div>
                    `;
                } else {
                    status.innerText = data.error || 'Bir hata oluştu.';
                    status.style.display = 'block';
                    status.style.color = 'red';
                    btn.innerText = 'Tekrar Dene';
                    btn.disabled = false;
                }
            } catch (err) {
                status.innerText = 'Bağlantı hatası.';
                status.style.display = 'block';
                btn.disabled = false;
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
